<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PROOFSTACK pricing card design kit" width="1200" height="720" viewBox="0 0 1200 720"><title>PROOFSTACK pricing card design kit</title>
  <rect width="1200" height="720" fill="#050708"/>
  <!-- Toggle -->
  <rect x="440" y="48" width="320" height="52" rx="26" fill="#f3f0e8" fill-opacity="0.04" stroke="#f3f0e8" stroke-opacity="0.12"/>
  <rect x="446" y="54" width="150" height="40" rx="20" fill="#f3f0e8"/>
  <text x="521" y="80" text-anchor="middle" fill="#050708" font-family="Geist Variable, sans-serif" font-size="15" font-weight="600">Mensuel</text>
  <text x="680" y="80" text-anchor="middle" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="15">Annuel</text>

  <!-- Card: Developer (plan à montrer en vedette : featured) -->
  <g transform="translate(60,150)">
    <rect width="300" height="500" rx="16" fill="#0a1014" stroke="#73d68b" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="24" y="24" width="124" height="28" rx="14" fill="#73d68b" fill-opacity="0.14"/>
    <text x="86" y="43" text-anchor="middle" fill="#78e3cb" font-family="JetBrains Mono Variable, monospace" font-size="12">RECOMMANDÉ</text>
    <text x="24" y="110" fill="#f3f0e8" font-family="Instrument Serif, serif" font-size="36">Developer</text>
    <text x="24" y="170" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="52" font-weight="600">$15</text>
    <text x="24" y="200" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="15">par mois</text>
    <rect x="24" y="226" width="252" height="1" fill="#f3f0e8" fill-opacity="0.12"/>
    <g fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="15">
      <text x="24" y="264">200 tests / mois</text>
      <text x="24" y="296">40 audits IA / mois</text>
    </g>
    <rect x="24" y="420" width="252" height="52" rx="26" fill="#73d68b"/>
    <text x="150" y="452" text-anchor="middle" fill="#050708" font-family="Geist Variable, sans-serif" font-size="16" font-weight="600">Choisir Developer</text>
  </g>

  <!-- Card: Studio -->
  <g transform="translate(400,150)">
    <rect width="300" height="500" rx="16" fill="#0a1014" stroke="#f3f0e8" stroke-opacity="0.12"/>
    <text x="24" y="110" fill="#f3f0e8" font-family="Instrument Serif, serif" font-size="36">Studio</text>
    <text x="24" y="170" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="52" font-weight="600">$39</text>
    <text x="24" y="200" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="15">par mois</text>
    <rect x="24" y="226" width="252" height="1" fill="#f3f0e8" fill-opacity="0.12"/>
    <g fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="15">
