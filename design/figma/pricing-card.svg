    </g>
    <rect x="24" y="420" width="252" height="52" rx="26" fill="none" stroke="#f3f0e8" stroke-opacity="0.24" stroke-width="1.5"/>
    <text x="150" y="452" text-anchor="middle" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="16">Choisir Studio</text>
  </g>

  <!-- Card: Agency -->
  <g transform="translate(740,150)">
    <rect width="300" height="500" rx="16" fill="#0a1014" stroke="#f3f0e8" stroke-opacity="0.12"/>
    <text x="24" y="110" fill="#f3f0e8" font-family="Instrument Serif, serif" font-size="36">Agency</text>
