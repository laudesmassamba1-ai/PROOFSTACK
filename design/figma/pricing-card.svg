  <text x="600" y="690" text-anchor="middle" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="14">Prix USD issus de packages/billing/src/plans.ts. Sur le site, les prix sont lus du catalogue, jamais saisis à la main.</text>
