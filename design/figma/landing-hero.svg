<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050708"/>
      <stop offset="1" stop-color="#0a1014"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73d68b"/>
      <stop offset="0.5" stop-color="#78e3cb"/>
      <stop offset="1" stop-color="#7864d9"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Nav -->
  <text x="96" y="84" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="22" font-weight="600">PROOFCORE</text>
  <g fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="15">
    <text x="760" y="82">Produit</text>
    <text x="850" y="82">Plateforme</text>
    <text x="970" y="82">Tarifs</text>
    <text x="1060" y="82">Documentation</text>
  </g>
  <rect x="1190" y="54" width="154" height="42" rx="21" fill="#f3f0e8"/>
  <text x="1267" y="80" text-anchor="middle" fill="#050708" font-family="Geist Variable, sans-serif" font-size="15" font-weight="600">Commencer</text>

  <!-- Eyebrow -->
  <rect x="96" y="194" width="250" height="34" rx="17" fill="#73d68b" fill-opacity="0.12"/>
  <text x="221" y="216" text-anchor="middle" fill="#78e3cb" font-family="JetBrains Mono Variable, monospace" font-size="13">PREUVE · VÉRIFIABLE</text>

  <!-- Headline -->
  <text x="96" y="340" fill="#f3f0e8" font-family="Instrument Serif, serif" font-size="96" letter-spacing="-2">Chaque décision,</text>
  <text x="96" y="446" fill="url(#glow)" font-family="Instrument Serif, serif" font-size="96" letter-spacing="-2">prouvée.</text>

  <!-- Lede -->
  <text x="96" y="520" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="21">PROOFCORE relie chaque résultat à ses sources, ses calculs</text>
  <text x="96" y="552" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="21">et ses contrôles, pour que personne n'ait à vous croire sur parole.</text>

  <!-- CTAs -->
  <rect x="96" y="604" width="220" height="56" rx="28" fill="#73d68b"/>
  <text x="206" y="638" text-anchor="middle" fill="#050708" font-family="Geist Variable, sans-serif" font-size="17" font-weight="600">Télécharger</text>
  <rect x="332" y="604" width="200" height="56" rx="28" fill="none" stroke="#f3f0e8" stroke-opacity="0.24" stroke-width="1.5"/>
  <text x="432" y="638" text-anchor="middle" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="17">Voir les tarifs</text>

  <!-- Proof panel -->
  <rect x="940" y="250" width="404" height="420" rx="16" fill="#141412" stroke="#f3f0e8" stroke-opacity="0.12"/>
  <text x="976" y="296" fill="#b8b3a8" font-family="JetBrains Mono Variable, monospace" font-size="13">VÉRIFICATION</text>
  <circle cx="982" cy="350" r="6" fill="#73d68b"/>
  <text x="1004" y="355" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="17">Source validée</text>
  <circle cx="982" cy="398" r="6" fill="#73d68b"/>
  <text x="1004" y="403" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="17">Calcul rejoué</text>
  <circle cx="982" cy="446" r="6" fill="#f28a49"/>
  <text x="1004" y="451" fill="#f3f0e8" font-family="Geist Variable, sans-serif" font-size="17">Hypothèse à confirmer</text>
  <rect x="976" y="490" width="332" height="1" fill="#f3f0e8" fill-opacity="0.12"/>
  <text x="976" y="540" fill="#78e3cb" font-family="JetBrains Mono Variable, monospace" font-size="14">score de preuve  94 / 100</text>
  <rect x="976" y="560" width="332" height="10" rx="5" fill="#f3f0e8" fill-opacity="0.08"/>
  <rect x="976" y="560" width="312" height="10" rx="5" fill="url(#glow)"/>
  <text x="976" y="622" fill="#b8b3a8" font-family="Geist Variable, sans-serif" font-size="14">Dernier contrôle : il y a 2 min</text>
</svg>
