name: release

# Produces the installers people download. Run it by pushing a tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Each job builds the installer for its own platform, runs it for real, checks that the
# installed binary answers, and only then attaches it to the release. An installer that was
# never installed is not a tested installer.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: "proofcore-*-installer-linux-x64.run"
            extra: "proofcore_*_amd64.deb"
          - os: windows-latest
            target: win-x64
            artifact: "proofcore-*-setup-win-x64.exe"
          - os: macos-14
            target: darwin-arm64
            artifact: "proofcore-*-installer-darwin-arm64.run"
          - os: macos-13
            target: darwin-x64
            artifact: "proofcore-*-installer-darwin-x64.run"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the CLI and the installer
        run: |
          pnpm exec node tooling/scripts/build-binary.mjs --target ${{ matrix.target }}
          pnpm exec node tooling/scripts/build-installers.mjs --target ${{ matrix.target }}

      - name: Install it the way a user would, on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          chmod +x artifacts/installers/proofcore-*-installer-linux-x64.run
          PROOFCORE_PREFIX="$RUNNER_TEMP/proofcore" ./artifacts/installers/proofcore-*-installer-linux-x64.run
          "$RUNNER_TEMP/proofcore/bin/proofcore" --version
          dpkg-deb -I artifacts/installers/proofcore_*_amd64.deb >/dev/null

      - name: Install it the way a user would, on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installers/proofcore-*-setup-win-x64.exe | Select-Object -First 1
          # Double-click equivalent: run it, then check the installed command answers.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "localappdata"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          & $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          $installed = Join-Path $env:LOCALAPPDATA "PROOFCORE\bin\proofcore.exe"
          if (-not (Test-Path $installed)) { throw "nothing was installed at $installed" }
          & $installed --version

      - name: Install it the way a user would, on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          chmod +x artifacts/installers/proofcore-*-installer-darwin-*.run
          PROOFCORE_PREFIX="$RUNNER_TEMP/proofcore" ./artifacts/installers/proofcore-*-installer-darwin-*.run
          "$RUNNER_TEMP/proofcore/bin/proofcore" --version

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            artifacts/installers/*
            artifacts/bin/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: "PROOFCORE-*"
          - os: windows-latest
            target: win-x64
            artifact: "PROOFCORE-*"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the native package for this platform
        run: pnpm app:dist:${{ matrix.target == 'win-x64' && 'win' || 'linux' }}

      - name: Prove the packaged app starts and serves the embedded interface
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APP="artifacts/desktop/linux-unpacked/proofcore"
          test -x "$APP"
          # The smoke gate exits before opening a window; the full window smoke belongs to
          # the local test, not a headless release runner. This proves the package has its
          # sidecar, web bundle, icons and launchable binary.
          test -f artifacts/desktop/linux-unpacked/resources/web/index.html
          test -x artifacts/desktop/linux-unpacked/resources/sidecar/proofcore-linux-x64
          file artifacts/desktop/PROOFCORE-*.AppImage
          dpkg-deb -I artifacts/desktop/PROOFCORE-*.deb >/dev/null

      - name: Prove the packaged app has its Windows files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "artifacts/desktop/win-unpacked/PROOFCORE.exe"
          if (-not (Test-Path $app)) { throw "missing $app" }
          if (-not (Test-Path "artifacts/desktop/win-unpacked/resources/web/index.html")) { throw "missing embedded web" }
          if (-not (Test-Path "artifacts/desktop/win-unpacked/resources/sidecar/proofcore-win-x64.exe")) { throw "missing sidecar" }
          Get-ChildItem artifacts/desktop/PROOFCORE-*.exe | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            artifacts/desktop/*.deb
            artifacts/desktop/*.AppImage
            artifacts/desktop/*.exe
            artifacts/desktop/latest*.yml
            artifacts/desktop/*.blockmap

  publish:
    needs: [installers, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the update manifest
        run: |
          node -e '
          const fs = require("fs"), path = require("path"), crypto = require("crypto");
          const version = require("./packages/cli/package.json").version;
          const files = {};
          for (const name of fs.readdirSync("dist")) {
            // Only the runnable binaries: the manifest tells the CLI which file to fetch.
            if (!/^proofcore-(linux|darwin|win)/.test(name) || name.endsWith(".sha256")) continue;
            const target = name.replace(/^proofcore-/, "").replace(/\.exe$/, "");
            const bytes = fs.readFileSync(path.join("dist", name));
            files[target] = {
              binary: name,
              sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
              size: bytes.length,
            };
          }
          if (!Object.keys(files).length) throw new Error("no binaries to describe");
          fs.writeFileSync(
            "dist/manifest.json",
            JSON.stringify({ version, channel: "stable", publishedAt: new Date().toISOString(), files }, null, 2)
          );
          console.log("manifest.json covers", Object.keys(files).join(", "));
          '

      - name: Attach every artifact to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Windows desktop app** — download `PROOFCORE-*.exe` and double-click it.
            It creates a Start Menu entry, a desktop shortcut and a native window with the
            embedded product interface. No administrator rights.

            **Linux desktop app** (Mint, Ubuntu, Debian) — either:
            - `sudo dpkg -i PROOFCORE-*_amd64.deb`
            - or `chmod +x PROOFCORE-*.AppImage && ./PROOFCORE-*.AppImage`

            The desktop app includes the local engine, the web interface and the icons.
            The terminal installers below are separate and remain available for servers/CI.

            **Windows CLI** — `proofcore-*-setup-win-x64.exe` installs the command for the
            current user and adds it to PATH.

            **Linux CLI** — `sudo dpkg -i proofcore_*_amd64.deb` or
            `chmod +x proofcore-*-installer-linux-x64.run && ./proofcore-*-installer-linux-x64.run`.

            **macOS CLI** — `chmod +x proofcore-*-installer-darwin-*.run && ./proofcore-*-installer-darwin-*.run`

            **Updates** — `proofcore update` checks the release manifest and shows what it
            would install; `proofcore update --yes` verifies the sha256 and replaces the
            binary (the old one is renamed aside first, so a failed update leaves a working
            command). The hub header shows `↑ x.y.z · /update` when a release is available.

            Then, once:

                proofcore login     sign in through the browser
                proofcore           the full-screen hub

            Everything you run afterwards executes on your machine. The account is used for
            sign-in, projects, reports and billing — not to compute for you.
