packages:
  - 'packages/*'
  - 'packages/modules/*'
  - 'packages/adapters/*'
  - 'apps/*'
  - 'tooling/*'

# pnpm >= 10 blocks dependency lifecycle scripts unless explicitly allowed here.
# Only these four legitimately need a postinstall step (native binary linking).
# Anything else that asks for a build script is a signal to review, not to approve.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261116.1'
  - hono@4.13.19
