services:
  n8n:
    image: n8nio/n8n:latest
    container_name: proofcore-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Africa/Porto-Novo
      PROOFCORE_WEBHOOK_SECRET: dev-only-change-me
      # Optional Slack Incoming Webhook; leave empty to skip notifications.
      SLACK_WEBHOOK_URL: ""
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
