name = "proofcore-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
# D1 is the production database. Local development uses the same SQL through
# node:sqlite (see src/node.ts), so a migration that works locally works on D1.
#
# Create the database once with:
#   wrangler d1 create proofcore
# then paste the returned database_id below.

[[d1_databases]]
binding = "DB"
database_name = "proofcore"
database_id = "4dd9116b-df79-47f4-99ef-eb19aa019405"
migrations_dir = "migrations"

[observability]
enabled = true

# Secrets are never placed in this file. Set them with:
#   wrangler secret put SASPAY_API_KEY
#   wrangler secret put SASPAY_WEBHOOK_SECRET
#   wrangler secret put N8N_WEBHOOK_URL
#   wrangler secret put N8N_WEBHOOK_SECRET

[vars]
NODE_ENV = "production"
# Every web origin allowed to make credentialed calls, comma separated. The first entry
# is the canonical one used when a link (password reset, email) needs an absolute URL.
#
# `*` covers exactly one label and exists for deployment previews: Cloudflare Pages and
# Vercel mint a new hostname per deployment, and without it every write from a preview
# URL fails with `cross_origin_denied`. Never use a wildcard over a shared suffix such
# as `*.pages.dev` — anyone can deploy there.
WEB_ORIGIN = "https://proofstack-iota.vercel.app,https://proofstack-01z.pages.dev,https://*.proofstack-01z.pages.dev,https://proofcore-iota.vercel.app,https://proofcore-01z.pages.dev,https://proofstack-*-laudesmassamba1-ais-projects.vercel.app"
API_ORIGIN = "https://proofcore-api.laudesmassamba1.workers.dev"

# Comma-separated allowlist for the read-only /app/admin operations console.
# It is set as a Worker secret, never committed: publishing the operator's address
# in the repository gives phishing a target. Empty disables the console; there is no
# "first user is admin" fallback:
#   wrangler secret put ADMIN_EMAILS

# This production deployment runs the deterministic sandbox provider (no SasPay
# credentials are configured). The owner explicitly opted in to fictitious payments so
# plans can be tested end to end. Without this flag production refuses to credit a
# sandbox checkout, because a missing provider key would otherwise be a free upgrade.
ALLOW_SANDBOX_BILLING = "true"

# Assistant requests per hour, per account and address. High on purpose: a person working
# with their own assistant must never meet it; it stops a runaway loop, not a conversation.
AI_RATE_LIMIT_PER_HOUR = "5000"

# Real browser for the assistant's browse_url tool: renders JavaScript, returns a screenshot.
[browser]
binding = "BROWSER"
