name = "proofcore-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
# D1 is the production database. Local development uses the same SQL through
# node:sqlite (see src/node.ts), so a migration that works locally works on D1.
#
# Create the database once with:
#   wrangler d1 create proofcore
# then paste the returned database_id below.

[[d1_databases]]
binding = "DB"
database_name = "proofcore"
database_id = "4dd9116b-df79-47f4-99ef-eb19aa019405"
migrations_dir = "migrations"

[observability]
enabled = true

# Secrets are never placed in this file. Set them with:
#   wrangler secret put SASPAY_API_KEY
#   wrangler secret put SASPAY_WEBHOOK_SECRET
#   wrangler secret put N8N_WEBHOOK_URL
#   wrangler secret put N8N_WEBHOOK_SECRET

[vars]
NODE_ENV = "production"
WEB_ORIGIN = "https://proofstack-iota.vercel.app,https://proofcore-iota.vercel.app,https://proofcore-01z.pages.dev"
API_ORIGIN = "https://proofcore-api.laudesmassamba1.workers.dev"

# Comma-separated allowlist for the read-only /app/admin operations console.
# This is an authorization list, not a secret. Empty disables the console; there is
# no "first user is admin" fallback. Set it to the creator's own account email:
#   ADMIN_EMAILS = "you@example.com"
ADMIN_EMAILS = "extends08@gmail.com"

# Assistant requests per hour, per account and address. High on purpose: a person working
# with their own assistant must never meet it; it stops a runaway loop, not a conversation.
AI_RATE_LIMIT_PER_HOUR = "5000"

# Real browser for the assistant's browse_url tool: renders JavaScript, returns a screenshot.
[browser]
binding = "BROWSER"
