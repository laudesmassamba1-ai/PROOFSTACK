appId: dev.proofcore.desktop
productName: PROOFCORE
copyright: PROOFCORE
# The npm name is scoped, which is not a file name: name the artifacts after the product.
artifactName: PROOFCORE-${version}-${arch}.${ext}

directories:
  output: ../../artifacts/desktop
  buildResources: build

# Only what the window needs. The engine travels in extraResources as the same binary the
# CLI installers ship, so "the app" and "the command" cannot be different programs.
files:
  - main.cjs
  - preload.cjs
  - src/**/*.cjs
  - package.json
  - build/icon.png

# The engine: the same binary the CLI installers ship. One entry, filtered per platform so a
# Linux build does not carry the Windows executable and vice versa.
extraResources:
  - from: ../../artifacts/bin
    to: sidecar
    filter:
      - "proofcore-linux-${arch}*"
      - "proofcore-win-${arch}*"
      - "proofcore-darwin-${arch}*"
  # The same React application the site serves. The local engine serves it from 127.0.0.1
  # and proxies the site API, so the window has the product UI without being a browser.
  - from: ../../apps/web/dist
    to: web

linux:
  executableName: proofcore
  target:
    - deb
    - AppImage
  category: Development
  icon: build/icons
  synopsis: Software quality and reliability
  description: >
    PROOFCORE runs on this machine: the agent, the audits, the sandbox and the index are
    local. The account, projects, reports and sync go through the site.
  desktop:
    Name: PROOFCORE
    Comment: Software quality and reliability
    StartupWMClass: PROOFCORE

deb:
  packageName: proofcore
  category: devel

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PROOFCORE

mac:
  # The dmg is what a person installs; the zip is what the updater replaces. Squirrel.Mac
  # cannot update from a dmg, so a release without the zip would ship a window that can
  # never update itself — and `latest-mac.yml` would name a file that is not there.
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools

publish:
  provider: github
  owner: laudesmassamba1-ai
  repo: PROOFSTACK
